<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEE 30-Day Destruction Plan</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --bg2: #0f0f1a;
    --bg3: #13131f;
    --surface: #1a1a2e;
    --surface2: #1f1f35;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #e8e8f0;
    --text2: #9090a8;
    --text3: #5a5a78;
    --math: #4facfe;
    --math-bg: rgba(79,172,254,0.08);
    --math-border: rgba(79,172,254,0.25);
    --physics: #43e97b;
    --physics-bg: rgba(67,233,123,0.08);
    --physics-border: rgba(67,233,123,0.25);
    --chem: #f7971e;
    --chem-bg: rgba(247,151,30,0.08);
    --chem-border: rgba(247,151,30,0.25);
    --test: #f953c6;
    --test-bg: rgba(249,83,198,0.08);
    --test-border: rgba(249,83,198,0.25);
    --rev: #a78bfa;
    --rev-bg: rgba(167,139,250,0.08);
    --rev-border: rgba(167,139,250,0.25);
    --done: rgba(67,233,123,0.15);
    --glow: 0 0 40px rgba(79,172,254,0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated bg */
  .bg-grid {
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(79,172,254,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,172,254,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }

  .bg-orb {
    position: fixed; border-radius: 50%; filter: blur(100px);
    pointer-events: none; z-index: 0; opacity: 0.4;
    animation: orbFloat 12s ease-in-out infinite;
  }
  .orb1 { width: 400px; height: 400px; background: rgba(79,172,254,0.12); top: -100px; right: -100px; animation-delay: 0s; }
  .orb2 { width: 300px; height: 300px; background: rgba(167,139,250,0.1); bottom: 20%; left: -80px; animation-delay: -6s; }

  @keyframes orbFloat {
    0%,100% { transform: translateY(0px) scale(1); }
    50% { transform: translateY(-30px) scale(1.05); }
  }

  .container { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 0 24px 80px; }

  /* Header */
  header {
    padding: 48px 0 40px;
    display: flex; align-items: flex-start; justify-content: space-between;
    flex-wrap: wrap; gap: 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 40px;
    animation: fadeDown 0.6s ease both;
  }

  .header-left h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(28px, 5vw, 52px);
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1;
    background: linear-gradient(135deg, #fff 30%, var(--math) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header-left p {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--text3);
    margin-top: 8px;
    letter-spacing: 0.5px;
  }

  .header-stats { display: flex; gap: 20px; flex-wrap: wrap; }

  .stat-pill {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 20px;
    text-align: center;
    min-width: 80px;
    transition: transform 0.2s, border-color 0.2s;
  }
  .stat-pill:hover { transform: translateY(-2px); border-color: var(--border2); }
  .stat-pill .num {
    font-size: 22px; font-weight: 800;
    background: linear-gradient(135deg, var(--math), var(--rev));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .stat-pill .lbl { font-size: 11px; color: var(--text3); margin-top: 2px; font-family: 'Space Mono', monospace; }

  /* Progress bar */
  .progress-bar-wrap {
    margin-bottom: 36px;
    animation: fadeUp 0.5s 0.2s ease both;
  }
  .progress-bar-label {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
    font-family: 'Space Mono', monospace; font-size: 11px; color: var(--text3);
  }
  .progress-bar-label span { color: var(--math); font-weight: 700; }
  .progress-track {
    height: 6px; background: var(--surface2); border-radius: 99px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, var(--math), var(--rev));
    transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 12px rgba(79,172,254,0.5);
    width: 0%;
  }

  /* Week tabs */
  .week-tabs {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-bottom: 32px;
    animation: fadeUp 0.5s 0.3s ease both;
  }

  .week-tab {
    padding: 8px 22px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .week-tab:hover { border-color: var(--border2); color: var(--text); background: var(--surface); }
  .week-tab.active {
    background: var(--math);
    border-color: var(--math);
    color: #0a0a0f;
    font-weight: 700;
    box-shadow: 0 0 20px rgba(79,172,254,0.3);
  }

  /* Days grid */
  .days-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }

  /* Day card */
  .day-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
    animation: cardIn 0.4s ease both;
  }
  .day-card:hover { transform: translateY(-3px); border-color: var(--border2); box-shadow: var(--glow); }
  .day-card.completed { border-color: rgba(67,233,123,0.3); background: linear-gradient(135deg, var(--surface), rgba(67,233,123,0.04)); }

  .day-card-header {
    padding: 16px 20px;
    cursor: pointer;
    display: flex; align-items: center; gap: 12px;
    position: relative;
    border-bottom: 1px solid var(--border);
  }

  .day-circle {
    width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700;
    flex-shrink: 0;
    transition: transform 0.3s;
  }
  .day-card:hover .day-circle { transform: scale(1.1) rotate(-5deg); }

  .day-info { flex: 1; min-width: 0; }
  .day-num-label { font-size: 10px; color: var(--text3); font-family: 'Space Mono', monospace; letter-spacing: 0.5px; text-transform: uppercase; }
  .day-title-text { font-size: 14px; font-weight: 700; color: var(--text); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .day-header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .day-progress-ring { width: 30px; height: 30px; flex-shrink: 0; }
  .ring-bg { fill: none; stroke: var(--border2); stroke-width: 3; }
  .ring-fill { fill: none; stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset 0.6s cubic-bezier(0.4,0,0.2,1); transform: rotate(-90deg); transform-origin: center; }
  .ring-text { font-size: 8px; font-family: 'Space Mono', monospace; text-anchor: middle; dominant-baseline: central; }

  .chevron-icon { width: 16px; height: 16px; color: var(--text3); transition: transform 0.3s; flex-shrink: 0; }
  .day-card.open .chevron-icon { transform: rotate(180deg); }

  /* Task list */
  .task-list {
    max-height: 0; overflow: hidden;
    transition: max-height 0.45s cubic-bezier(0.4,0,0.2,1);
  }
  .day-card.open .task-list { max-height: 2000px; }

  .task-section-label {
    padding: 10px 20px 4px;
    font-size: 10px;
    font-family: 'Space Mono', monospace;
    color: var(--text3);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .task-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 10px 20px;
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
    border-radius: 8px;
    margin: 2px 8px;
  }
  .task-item:hover { background: rgba(255,255,255,0.03); }
  .task-item.done { opacity: 0.55; }

  .task-check {
    width: 18px; height: 18px;
    border-radius: 5px;
    border: 1.5px solid var(--border2);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
    transition: all 0.2s;
    background: transparent;
  }
  .task-item:hover .task-check { border-color: var(--text2); }
  .task-item.done .task-check {
    background: var(--physics);
    border-color: var(--physics);
  }

  .check-svg { width: 10px; height: 10px; display: none; }
  .task-item.done .check-svg { display: block; }

  .task-text-wrap { flex: 1; min-width: 0; }
  .task-text {
    font-size: 13px; color: var(--text); line-height: 1.5;
    transition: color 0.2s;
  }
  .task-item.done .task-text { text-decoration: line-through; color: var(--text3); }
  .task-sub {
    font-size: 11px; color: var(--text3);
    font-family: 'Space Mono', monospace;
    margin-top: 2px;
    line-height: 1.4;
  }

  .task-done-flash {
    position: absolute; inset: 0; background: rgba(67,233,123,0.08);
    border-radius: 8px; pointer-events: none;
    animation: flashGreen 0.4s ease forwards;
  }
  @keyframes flashGreen {
    0% { opacity: 1; } 100% { opacity: 0; }
  }

  /* Subject badge */
  .subject-badge {
    font-size: 10px; font-family: 'Space Mono', monospace;
    padding: 3px 8px; border-radius: 5px; font-weight: 700;
    letter-spacing: 0.5px;
  }
  .badge-math { background: var(--math-bg); color: var(--math); border: 1px solid var(--math-border); }
  .badge-physics { background: var(--physics-bg); color: var(--physics); border: 1px solid var(--physics-border); }
  .badge-chem { background: var(--chem-bg); color: var(--chem); border: 1px solid var(--chem-border); }
  .badge-test { background: var(--test-bg); color: var(--test); border: 1px solid var(--test-border); }
  .badge-rev { background: var(--rev-bg); color: var(--rev); border: 1px solid var(--rev-border); }

  /* Colors per subject */
  .day-math .day-circle { background: var(--math-bg); color: var(--math); border: 1px solid var(--math-border); }
  .day-physics .day-circle { background: var(--physics-bg); color: var(--physics); border: 1px solid var(--physics-border); }
  .day-chem .day-circle { background: var(--chem-bg); color: var(--chem); border: 1px solid var(--chem-border); }
  .day-test .day-circle { background: var(--test-bg); color: var(--test); border: 1px solid var(--test-border); }
  .day-rev .day-circle { background: var(--rev-bg); color: var(--rev); border: 1px solid var(--rev-border); }
  .day-math .ring-fill { stroke: var(--math); }
  .day-physics .ring-fill { stroke: var(--physics); }
  .day-chem .ring-fill { stroke: var(--chem); }
  .day-test .ring-fill { stroke: var(--test); }
  .day-rev .ring-fill { stroke: var(--rev); }
  .day-math .ring-text { fill: var(--math); }
  .day-physics .ring-text { fill: var(--physics); }
  .day-chem .ring-text { fill: var(--chem); }
  .day-test .ring-text { fill: var(--test); }
  .day-rev .ring-text { fill: var(--rev); }

  /* Confetti */
  .confetti-piece {
    position: fixed; width: 8px; height: 8px; border-radius: 2px;
    pointer-events: none; z-index: 9999;
    animation: confettiFall 1s ease forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(200px) rotate(720deg); opacity: 0; }
  }

  /* Animations */
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes cardIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

  /* Streak banner */
  .streak-banner {
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(135deg, rgba(247,151,30,0.1), rgba(249,83,198,0.08));
    border: 1px solid rgba(247,151,30,0.2);
    border-radius: 12px;
    padding: 12px 20px;
    margin-bottom: 28px;
    animation: fadeUp 0.5s 0.15s ease both;
  }
  .streak-icon { font-size: 20px; }
  .streak-text { font-size: 13px; color: var(--text2); }
  .streak-text strong { color: var(--chem); font-weight: 700; }

  /* Day card footer */
  .day-footer {
    padding: 10px 20px 14px;
    display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid var(--border);
    margin-top: 4px;
  }
  .day-footer-text { font-size: 11px; color: var(--text3); font-family: 'Space Mono', monospace; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 99px; }

  /* Hidden week */
  .week-section { display: none; }
  .week-section.active { display: block; }

  /* Toast */
  .toast {
    position: fixed; bottom: 32px; right: 32px; z-index: 9998;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 12px;
    padding: 12px 20px;
    font-size: 13px; color: var(--text);
    transform: translateY(100px); opacity: 0;
    transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
    pointer-events: none;
    max-width: 280px;
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  @media (max-width: 600px) {
    .days-grid { grid-template-columns: 1fr; }
    header { padding: 32px 0 28px; }
    .header-stats { gap: 10px; }
    .stat-pill { padding: 10px 14px; min-width: 60px; }
  }
</style>
</head>

const WEEKS = [
  { label: 'Week 1', days: [0,6] },
  { label: 'Week 2', days: [7,13] },
  { label: 'Week 3', days: [14,20] },
  { label: 'Week 4', days: [21,29] },
];

let state = JSON.parse(localStorage.getItem('jee-plan-v2') || '{}');

function saveState() { localStorage.setItem('jee-plan-v2', JSON.stringify(state)); }

function getKey(dayIdx, taskIdx) { return `d${dayIdx}_t${taskIdx}`; }

function getTotalStats() {
  const total = PLAN.reduce((a, d) => a + d.tasks.length, 0);
  const done = Object.values(state).filter(Boolean).length;
  const daysDone = PLAN.filter((d, di) => d.tasks.every((_, ti) => state[getKey(di, ti)])).length;
  return { total, done, daysDone };
}

function getDayProgress(dayIdx) {
  const tasks = PLAN[dayIdx].tasks;
  const done = tasks.filter((_, ti) => state[getKey(dayIdx, ti)]).length;
  return { done, total: tasks.length };
}

function updateGlobalStats() {
  const { total, done, daysDone } = getTotalStats();
  document.getElementById('total-done').textContent = done;
  document.getElementById('total-pct').textContent = Math.round(done/total*100) + '%';
  document.getElementById('days-done').textContent = daysDone;
  document.getElementById('progress-text').textContent = `${done} / ${total} tasks`;
  document.getElementById('main-progress').style.width = (done/total*100) + '%';
  const streak = calcStreak();
  document.getElementById('streak-count').textContent = streak + ' day' + (streak !== 1 ? 's' : '');
}

function calcStreak() {
  let streak = 0;
  for (let i = 0; i < PLAN.length; i++) {
    const { done, total } = getDayProgress(i);
    if (done === total && total > 0) streak++;
    else break;
  }
  return streak;
}

function updateRing(dayIdx) {
  const { done, total } = getDayProgress(dayIdx);
  const pct = done / total;
  const r = 10, circ = 2 * Math.PI * r;
  const fill = document.querySelector(`#ring-fill-${dayIdx}`);
  const txt = document.querySelector(`#ring-text-${dayIdx}`);
  if (fill) fill.style.strokeDashoffset = circ - (circ * pct);
  if (txt) txt.textContent = Math.round(pct*100) + '%';
  const card = document.getElementById(`day-card-${dayIdx}`);
  if (card) {
    if (done === total) card.classList.add('completed');
    else card.classList.remove('completed');
  }
}

function toggleTask(dayIdx, taskIdx) {
  const key = getKey(dayIdx, taskIdx);
  state[key] = !state[key];
  saveState();

  const item = document.getElementById(`task-${dayIdx}-${taskIdx}`);
  if (item) {
    item.classList.toggle('done', state[key]);
    if (state[key]) {
      const flash = document.createElement('div');
      flash.className = 'task-done-flash';
      item.appendChild(flash);
      setTimeout(() => flash.remove(), 400);
    }
  }

  updateRing(dayIdx);
  updateGlobalStats();

  const { done, total } = getDayProgress(dayIdx);
  if (done === total) {
    showToast(`🔥 Day ${dayIdx+1} complete! Destruction in progress.`);
    spawnConfetti();
  }
}

function toggleDay(dayIdx) {
  const card = document.getElementById(`day-card-${dayIdx}`);
  if (card) card.classList.toggle('open');
}

function showTab(weekIdx) {
  document.querySelectorAll('.week-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.week-tab').forEach(b => b.classList.remove('active'));
  document.getElementById(`week-sec-${weekIdx}`).classList.add('active');
  document.getElementById(`week-tab-${weekIdx}`).classList.add('active');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function spawnConfetti() {
  const colors = ['#4facfe','#43e97b','#f7971e','#f953c6','#a78bfa'];
  for (let i = 0; i < 18; i++) {
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    c.style.cssText = `left:${Math.random()*100}vw;top:${Math.random()*40+10}vh;background:${colors[i%colors.length]};animation-duration:${0.8+Math.random()*0.8}s;animation-delay:${Math.random()*0.3}s;transform:rotate(${Math.random()*360}deg)`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 1200);
  }
}

function badgeClass(subject) {
  return { math:'badge-math', physics:'badge-physics', chem:'badge-chem', test:'badge-test', rev:'badge-rev' }[subject] || 'badge-rev';
}
function badgeLabel(subject) {
  return { math:'MATHS', physics:'PHYSICS', chem:'CHEM', test:'TEST DAY', rev:'REVISION' }[subject] || subject.toUpperCase();
}
function subjectClass(subject) {
  return `day-${subject}`;
}

function buildUI() {
  // Tabs
  const tabsEl = document.getElementById('week-tabs');
  const containerEl = document.getElementById('weeks-container');
  tabsEl.innerHTML = '';
  containerEl.innerHTML = '';

  WEEKS.forEach((week, wi) => {
    const btn = document.createElement('button');
    btn.className = 'week-tab' + (wi === 0 ? ' active' : '');
    btn.id = `week-tab-${wi}`;
    btn.textContent = week.label;
    btn.onclick = () => showTab(wi);
    tabsEl.appendChild(btn);

    const sec = document.createElement('div');
    sec.className = 'week-section' + (wi === 0 ? ' active' : '');
    sec.id = `week-sec-${wi}`;
    sec.innerHTML = `<div class="days-grid"></div>`;
    const grid = sec.querySelector('.days-grid');

    for (let di = week.days[0]; di <= week.days[1]; di++) {
      const d = PLAN[di];
      const { done, total } = getDayProgress(di);
      const pct = done / total;
      const r = 10, circ = 2 * Math.PI * r;
      const offset = circ - (circ * pct);

      const card = document.createElement('div');
      card.className = `day-card ${subjectClass(d.subject)}${done===total ? ' completed' : ''}`;
      card.id = `day-card-${di}`;
      card.style.animationDelay = `${(di - week.days[0]) * 0.06}s`;

      const tasksHtml = d.tasks.map((t, ti) => `
        <div class="task-item${state[getKey(di,ti)] ? ' done' : ''}" id="task-${di}-${ti}" onclick="toggleTask(${di},${ti})">
          <div class="task-check">
            <svg class="check-svg" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M1.5 5L4 7.5L8.5 2.5" stroke="#0a0a0f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="task-text-wrap">
            <div class="task-text">${t.text}</div>
            ${t.sub ? `<div class="task-sub">${t.sub}</div>` : ''}
          </div>
        </div>
      `).join('');

      card.innerHTML = `
        <div class="day-card-header" onclick="toggleDay(${di})">
          <div class="day-circle">${String(di+1).padStart(2,'0')}</div>
          <div class="day-info">
            <div class="day-num-label">Day ${di+1} &nbsp;·&nbsp; <span class="subject-badge ${badgeClass(d.subject)}">${badgeLabel(d.subject)}</span></div>
            <div class="day-title-text">${d.title}</div>
          </div>
          <div class="day-header-right">
            <svg class="day-progress-ring" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
              <circle class="ring-bg" cx="15" cy="15" r="${r}"/>
              <circle id="ring-fill-${di}" class="ring-fill" cx="15" cy="15" r="${r}"
                style="stroke-dasharray:${circ};stroke-dashoffset:${offset}"/>
              <text id="ring-text-${di}" class="ring-text" x="15" y="15">${Math.round(pct*100)}%</text>
            </svg>
            <svg class="chevron-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
        <div class="task-list">
          <div class="task-section-label">tasks — ${total} items</div>
          ${tasksHtml}
          <div class="day-footer">
            <span class="day-footer-text">${done} / ${total} complete</span>
            <span class="day-footer-text">${done===total ? '✓ cleared' : Math.round(pct*100)+'% done'}</span>
          </div>
        </div>
      `;
      grid.appendChild(card);
    }
    containerEl.appendChild(sec);
  });

  updateGlobalStats();
}

buildUI();
